name: publish-packages

# Builds the FreedomNAS packages for Arch and Artix and publishes them to the
# generic registry freedomnas-arch/<dev|main>, a pacman repository whose
# database bin/publish-codeberg.sh rewrites at each publish.
#
# Three jobs, so that only the kernel needs the self-hosted runner:
#
#   packages     the FreedomNAS packages, the community modules, topgrade and
#                the ZFS service scripts, on Codeberg's own runners: they are
#                published even when the self-hosted runner is off.
#   kernel-check whether this kernel version is already in the registry, on
#                Codeberg's smallest runner.
#   kernel       only when kernel-check says it is missing, on the
#                self-hosted runner (`runs-on: docker`), where its ccache
#                lives. It waits for packages: both rewrite the same
#                repository database, and two publishes at once would lose
#                one of them.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of the component repositories to build"
        type: string
        default: dev
  schedule:
    - cron: "37 4 * * *"

jobs:
  packages:
    runs-on: codeberg-medium
    container:
      image: archlinux:base-devel
    env:
      REF: ${{ inputs.ref || 'dev' }}
      GROUP: ${{ inputs.ref == 'main' && 'main' || 'dev' }}
    steps:
      - name: Install the tooling
        run: pacman -Syu --noconfirm --needed git nodejs curl python gnupg

      - name: Check out freedomnas-arch
        uses: actions/checkout@v4

      # A release is built from the newest release tag (vX.Y.Z, the same
      # name in every FreedomNAS repository), not from the tip of main.
      - name: Pick the ref to build
        run: |
          ref="$REF"
          if [ "$ref" = main ]; then
            ref="$(git ls-remote --tags --refs https://codeberg.org/FreedomNAS/freedomnas-core.git 'v*' \
              | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)"
            [ -n "$ref" ] || { echo "no release tag on freedomnas-core" >&2; exit 1; }
          fi
          echo "Building $ref"
          echo "FREEDOMNAS_REF=$ref" >> "$GITHUB_ENV"

      - name: Import the signing key
        env:
          ARCH_SIGNING_KEY: ${{ secrets.ARCH_SIGNING_KEY }}
        run: printf '%s\n' "$ARCH_SIGNING_KEY" | gpg --batch --quiet --import

      - name: Build the components
        run: |
          for pkg in freedomnas-profiles freedomnas-core freedomnas-docs freedomnas-webui freedomnas-installer; do
            sh bin/build-inside.sh 1000 "$PWD/$pkg" "$PWD/out" "$PWD/work/$pkg"
          done

      # Community modules have versions of their own: dev builds their dev
      # branch, main their own newest release tag, and a module with no tag
      # yet is left out of main. FREEDOMNAS_REF is the module's ref here.
      - name: Build the community modules
        run: |
          for repo in freedomnas-containers freedomnas-proxy; do
            pkg="freedomnas-module-${repo#freedomnas-}"
            ref=dev
            if [ "$REF" = main ]; then
              ref="$(git ls-remote --tags --refs "https://codeberg.org/FreedomNAS/$repo.git" 'v*' \
                | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)"
              [ -n "$ref" ] || { echo "$repo has no release tag yet: not built for main"; continue; }
            fi
            echo "Building $pkg at $ref"
            FREEDOMNAS_REF="$ref" sh bin/build-inside.sh 1000 "$PWD/$pkg" "$PWD/out" "$PWD/work/$pkg"
          done

      - name: Check out the ZFS service scripts
        run: |
          git clone --depth 1 https://codeberg.org/sarahmeow86/zfs-openrc zfs-openrc
          git clone --depth 1 https://codeberg.org/sarahmeow86/zfs-dinit zfs-dinit

      - name: Build topgrade, Caddy and lego for Artix and the ZFS service scripts if not published yet
        run: |
          for pkg in topgrade-bin caddy-bin lego-bin zfs-openrc zfs-dinit; do
            sh bin/is-published.sh "$pkg" || sh bin/build-inside.sh 1000 "$PWD/$pkg" "$PWD/out" "$PWD/work/$pkg"
          done

      - name: Publish
        env:
          CODEBERG_USER: ${{ secrets.PACKAGE_REGISTRY_USER }}
          CODEBERG_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: sh bin/publish-codeberg.sh

  kernel-check:
    runs-on: codeberg-tiny-lazy
    container:
      image: debian:trixie
    env:
      GROUP: ${{ inputs.ref == 'main' && 'main' || 'dev' }}
    outputs:
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - name: Install the tooling
        run: apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates curl git

      - name: Check out freedomnas-arch and linux-freedomnas
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" freedomnas-arch
          git clone --depth 1 --branch dev https://codeberg.org/FreedomNAS/linux-freedomnas linux-freedomnas

      - name: Is this kernel version published?
        id: check
        run: |
          if sh freedomnas-arch/bin/is-published.sh linux-freedomnas; then
            echo "missing=no" >> "$GITHUB_OUTPUT"
          else
            echo "missing=yes" >> "$GITHUB_OUTPUT"
          fi

  kernel:
    needs: [packages, kernel-check]
    if: needs.kernel-check.outputs.missing == 'yes'
    runs-on: docker
    container:
      image: archlinux:base-devel
      # The kernel's ccache, kept on the runner host between runs; the
      # runner's config.yaml must list it in valid_volumes.
      volumes:
        - /var/cache/freedomnas-ccache/arch:/ccache
    env:
      GROUP: ${{ inputs.ref == 'main' && 'main' || 'dev' }}
    steps:
      - name: Install the tooling
        run: pacman -Syu --noconfirm --needed git nodejs curl python gnupg

      - name: Check out freedomnas-arch
        uses: actions/checkout@v4

      - name: Import the signing key
        env:
          ARCH_SIGNING_KEY: ${{ secrets.ARCH_SIGNING_KEY }}
        run: printf '%s\n' "$ARCH_SIGNING_KEY" | gpg --batch --quiet --import

      - name: Build the kernel
        run: |
          git clone --depth 1 --branch dev https://codeberg.org/FreedomNAS/linux-freedomnas linux-freedomnas
          CCACHE_DIR=/ccache MAKEFLAGS="-j$(nproc)" sh bin/build-inside.sh 1000 "$PWD/linux-freedomnas" "$PWD/out" "$PWD/work/linux-freedomnas"

      - name: Publish
        env:
          CODEBERG_USER: ${{ secrets.PACKAGE_REGISTRY_USER }}
          CODEBERG_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: sh bin/publish-codeberg.sh
