name: publish-packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of the component repositories to build"
        type: string
        default: dev
  schedule:
    - cron: "37 4 * * *"

jobs:
  publish:
    runs-on: docker
    container:
      image: archlinux:base-devel
      # The kernel's ccache, kept on the runner host between runs; the
      # runner's config.yaml must list it in valid_volumes.
      volumes:
        - /var/cache/freedomnas-ccache/arch:/ccache
    env:
      FREEDOMNAS_REF: ${{ inputs.ref || 'dev' }}
      GROUP: ${{ inputs.ref == 'main' && 'main' || 'dev' }}
    steps:
      - name: Install the tooling
        run: pacman -Syu --noconfirm --needed git nodejs curl python gnupg

      - name: Check out freedomnas-arch
        uses: actions/checkout@v4

      - name: Import the signing key
        env:
          ARCH_SIGNING_KEY: ${{ secrets.ARCH_SIGNING_KEY }}
        run: printf '%s\n' "$ARCH_SIGNING_KEY" | gpg --batch --quiet --import

      - name: Build the components
        run: |
          for pkg in freedomnas-profiles freedomnas-core freedomnas-docs freedomnas-webui freedomnas-installer; do
            sh bin/build-inside.sh 1000 "$PWD/$pkg" "$PWD/out" "$PWD/work/$pkg"
          done

      - name: Check out the kernel and the ZFS service scripts
        run: |
          git clone --depth 1 --branch dev https://codeberg.org/FreedomNAS/linux-freedomnas linux-freedomnas
          git clone --depth 1 https://codeberg.org/sarahmeow86/zfs-openrc zfs-openrc
          git clone --depth 1 https://codeberg.org/sarahmeow86/zfs-dinit zfs-dinit

      - name: Build the kernel if its version is not published yet
        run: |
          if ! sh bin/is-published.sh linux-freedomnas; then
            CCACHE_DIR=/ccache MAKEFLAGS="-j$(nproc)" sh bin/build-inside.sh 1000 "$PWD/linux-freedomnas" "$PWD/out" "$PWD/work/linux-freedomnas"
          fi

      - name: Build topgrade and the ZFS service scripts if not published yet
        run: |
          for pkg in topgrade-bin zfs-openrc zfs-dinit; do
            sh bin/is-published.sh "$pkg" || sh bin/build-inside.sh 1000 "$PWD/$pkg" "$PWD/out" "$PWD/work/$pkg"
          done

      - name: Publish
        env:
          CODEBERG_USER: ${{ secrets.PACKAGE_REGISTRY_USER }}
          CODEBERG_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: sh bin/publish-codeberg.sh
